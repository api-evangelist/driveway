name: Driveway Corporation
description: 'Driveway Corporation was a dot-com-era online file storage and sharing
  service that operated driveway.com from roughly 1998 until 2001. Its consumer product
  let members "store and access files from any Web-connected computer" and share documents,
  photos and MP3s with friends and colleagues, with up to 100 MB of free storage on
  sign-up; it also marketed a white-label "Driveway Private Label Storage" offering
  to other websites. Battery Ventures lists Driveway Corporation as an exited investment.
  The company is defunct and no longer operates any web, developer or API surface.
  NOTE: the driveway.com domain today belongs to an unrelated business — Lithia Motors''
  Driveway online car marketplace — and must not be attributed to this company.'
